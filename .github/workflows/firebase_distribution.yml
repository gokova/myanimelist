name: Firebase App Distribution

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes describing this build'
        required: false
        default: 'Manual release via GitHub Actions'
        type: string
      testers_group:
        description: 'Firebase App Distribution tester group'
        required: false
        default: 'internal'
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode Google Services JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON secret not found! Build will fail to apply Firebase."
            exit 1
          fi

      - name: Decode Firebase Service Account Credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
          else
            echo "FIREBASE_SERVICE_ACCOUNT secret not found!"
            exit 1
          fi

      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
          else
            echo "RELEASE_KEYSTORE_BASE64 secret not found! Failing distribution to prevent inconsistent signing identity."
            exit 1
          fi

      - name: Create local.properties
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          INPUT_RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          INPUT_TESTERS_GROUP: ${{ github.event.inputs.testers_group }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "MAL_CLIENT_ID=${MAL_CLIENT_ID:-dummy_mal_client_id}" >> local.properties
          if [ -f release.keystore ]; then
            echo "RELEASE_KEYSTORE_PATH=release.keystore" >> local.properties
            echo "RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> local.properties
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> local.properties
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> local.properties
          fi
          echo "FIREBASE_APP_DISTRIBUTION_CREDENTIALS=service-account.json" >> local.properties
          echo "FIREBASE_APP_DISTRIBUTION_GROUPS=${INPUT_TESTERS_GROUP:-internal}" >> local.properties
          if [ -n "$INPUT_RELEASE_NOTES" ]; then
            NOTES="$INPUT_RELEASE_NOTES"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            NOTES="Release for tag ${GITHUB_REF#refs/tags/}"
          else
            NOTES="Main build (${GITHUB_SHA:0:7}): $COMMIT_MESSAGE"
          fi
          echo "FIREBASE_APP_DISTRIBUTION_RELEASE_NOTES=$NOTES" >> local.properties

      - name: Build and Upload to Firebase App Distribution
        run: ./gradlew appDistributionUploadRelease
